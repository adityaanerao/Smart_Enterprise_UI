<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>National - Smart Motor Control &amp; Monitoring Application</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter (Clear, Simple, Standard UI Font) -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', 'sans-serif'],
            display: ['"Inter"', 'sans-serif'],
          },
          colors: {
            brand: {
              red: '#D91D24',
              darkRed: '#B81319',
              navy: '#0E1E38',
              muted: '#4B5563'
            }
          }
        }
      }
    };
  </script>
<style data-purpose="custom-animations">
    /* Fade In and Slide Up Animations */
    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(22px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Subtle Spinner Rotation */
    @keyframes spinRing {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    /* Pulse Glow for Spinner */
    @keyframes softGlow {
      0%, 100% {
        filter: drop-shadow(0 0 4px rgba(217, 29, 36, 0.45));
      }
      50% {
        filter: drop-shadow(0 0 12px rgba(217, 29, 36, 0.8));
      }
    }

    /* Subtle shimmer for ambient particles */
    @keyframes floatParticle {
      0% {
        transform: translateY(0) scale(0.9);
        opacity: 0.2;
      }
      50% {
        opacity: 0.75;
        transform: translateY(-20px) scale(1.1);
      }
      100% {
        transform: translateY(-40px) scale(0.9);
        opacity: 0;
      }
    }

    /* Animation utility classes */
    .animate-in-1 {
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.15s;
    }
    .animate-in-2 {
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.3s;
    }
    .animate-in-3 {
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.45s;
    }
    .animate-in-4 {
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.6s;
    }
    .animate-in-5 {
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.75s;
    }

    .spinner-ring {
      animation: spinRing 1.1s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
    }

    .spinner-glow {
      animation: softGlow 2.4s ease-in-out infinite;
    }

    .particle {
      position: absolute;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0) 70%);
      pointer-events: none;
      animation: floatParticle 3.5s ease-in-out infinite;
    }
  </style>
<style data-purpose="background-styling">
    /* High visual clarity layer over background photo */
    .hero-gradient-overlay {
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.92) 0%,
        rgba(255, 255, 255, 0.82) 20%,
        rgba(255, 255, 255, 0.45) 36%,
        rgba(255, 255, 255, 0.05) 50%,
        rgba(0, 0, 0, 0.1) 75%,
        rgba(0, 0, 0, 0.65) 100%
      );
    }
    
    /* Sun glare glow in upper center */
    .ambient-sun-glow {
      background: radial-gradient(
        circle at 50% 18%,
        rgba(255, 240, 210, 0.6) 0%,
        rgba(255, 220, 160, 0.25) 35%,
        transparent 70%
      );
    }
  </style>
</head>
<body class="bg-gray-900 m-0 p-0 w-full h-screen overflow-hidden select-none font-sans antialiased flex justify-center items-center">
<!-- BEGIN: MobileViewportContainer -->
<!-- Container is strictly full height and responsive edge-to-edge for mobile displays -->
<main class="relative w-full max-w-md h-full overflow-hidden flex flex-col justify-between shadow-2xl bg-black" data-purpose="splash-screen-container">
<!-- Background photographic image matching reference landscape & water pump -->
<div class="absolute inset-0 z-0 overflow-hidden" data-purpose="scenic-background-wrapper">
<img alt="Agricultural farm at sunrise with water pump" class="w-full h-full object-cover object-center" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCtCXSQXRD9WMYbQtPPK11iytPkTYBU3WZB0m-6p7p4Ay43VsYeSVz0uVX-D9lCCRRc7xs183_0TT1AjFmDkTX0QzgjTiPC2XIBrHmMjC6lzii7iUVooT2QhDyJ0e_1kqqUgOM9lYnIMC3pRFvdbZLnpUJmKT3smNRfpSJLzZqhFl7AqwbcPwKNEqg2guaAcsd74_faLjCx7ktgObr67W-dExpM_ZFFwfE55MfMkyk1OWte8eW8QpAjA492Rjvklq7Xlw"/>
<!-- Gradient overlay for text legibility and bright sky appearance -->
<div class="absolute inset-0 hero-gradient-overlay pointer-events-none"></div>
<!-- Subtle top sunrise radiance glow -->
<div class="absolute inset-0 ambient-sun-glow pointer-events-none"></div>
<!-- Water mist / ambient sunlight floating specks -->
<div class="particle w-2 h-2 top-[58%] left-[62%]" style="animation-delay: 0.2s;"></div>
<div class="particle w-3 h-3 top-[65%] left-[54%]" style="animation-delay: 1.1s;"></div>
<div class="particle w-1.5 h-1.5 top-[60%] left-[70%]" style="animation-delay: 1.8s;"></div>
<div class="particle w-2 h-2 top-[72%] left-[48%]" style="animation-delay: 2.3s;"></div>
<div class="particle w-2.5 h-2.5 top-[52%] left-[65%]" style="animation-delay: 0.7s;"></div>
</div>
<!-- BEGIN: TopBrandingSection -->
<header class="relative z-10 w-full pt-16 sm:pt-20 px-6 flex flex-col items-center text-center" data-purpose="branding-content">
<!-- Brand Card: National Red Box -->
<div class="animate-in-1 opacity-0 mb-7 transition-transform hover:scale-[1.02] duration-300" data-purpose="logo-card">
<img src="../assets/national-logo.svg" alt="National Logo" class="w-[190px] h-auto drop-shadow-2xl">
</div>
<!-- Application Title -->
<h1 class="animate-in-2 opacity-0 text-[23.5px] sm:text-[25px] leading-[1.28] font-extrabold text-[#0D2040] max-w-[320px] tracking-[-0.015em] font-display" data-purpose="app-title">
        Smart Motor Control<br/>&amp; Monitoring Application
      </h1>
<!-- Elegant Red Accent Divider -->
<div class="animate-in-3 opacity-0 my-3.5" data-purpose="accent-divider">
<div class="w-11 h-[3px] bg-gradient-to-r from-[#d91d24] via-[#f02d35] to-[#d91d24] rounded-full shadow-sm"></div>
</div>
<!-- Subtitle -->
<p class="animate-in-4 opacity-0 text-[16px] sm:text-[17px] font-medium text-[#4B586E] tracking-tight" data-purpose="app-subtitle">
        A clearer way to control the farm
      </p>
</header>
<!-- END: TopBrandingSection -->
<!-- BEGIN: BottomLoadingSection -->
<footer class="relative z-10 w-full pb-14 flex flex-col items-center justify-end" data-purpose="loading-indicator-section">
<div class="animate-in-5 opacity-0 flex flex-col items-center gap-3" data-purpose="loader-wrapper">
<!-- Circular Progress Spinner -->
<div class="relative w-12 h-12 flex items-center justify-center spinner-glow">
<!-- Background track circle -->
<div class="w-11 h-11 rounded-full border-[3.5px] border-white/40 shadow-inner"></div>
<!-- Animated rotating red gradient arc ring -->
<svg class="absolute inset-0 w-12 h-12 spinner-ring" viewbox="0 0 48 48">
<defs>
<lineargradient id="spinnerGradient" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#D91D24" stop-opacity="0"></stop>
<stop offset="50%" stop-color="#E5232B" stop-opacity="0.6"></stop>
<stop offset="100%" stop-color="#FF1A23" stop-opacity="1"></stop>
</lineargradient>
</defs>
<circle cx="24" cy="24" fill="none" r="19" stroke="url(#spinnerGradient)" stroke-dasharray="80 120" stroke-linecap="round" stroke-width="3.8"></circle>
</svg>
</div>
<!-- Pulsing Loading Text -->
<span class="text-white text-[15.5px] font-medium tracking-wide drop-shadow-[0_2px_4px_rgba(0,0,0,0.85)] animate-pulse" data-purpose="loading-text">
          Loading...
        </span>
</div>
</footer>
<!-- END: BottomLoadingSection -->
</main>
<!-- END: MobileViewportContainer -->
<!-- JavaScript for dynamic particle drift & interactive subtle touch effect -->
<script data-purpose="splash-interaction">
    document.addEventListener('DOMContentLoaded', () => {
      // Optional interactive feedback: subtle screen press ripple
      const mainContainer = document.querySelector('main');
      if (mainContainer) {
        mainContainer.addEventListener('pointerdown', (e) => {
          const rect = mainContainer.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;

          const touchRipple = document.createElement('div');
          touchRipple.className = 'particle pointer-events-none';
          touchRipple.style.width = '24px';
          touchRipple.style.height = '24px';
          touchRipple.style.left = `${x - 12}px`;
          touchRipple.style.top = `${y - 12}px`;
          touchRipple.style.animation = 'floatParticle 1.5s ease-out forwards';
          touchRipple.style.background = 'radial-gradient(circle, rgba(255,255,255,0.7) 0%, rgba(217,29,36,0.2) 60%, transparent 100%)';
          
          mainContainer.appendChild(touchRipple);
          setTimeout(() => {
            touchRipple.remove();
          }, 1500);
        });
      }
    });
  </script>
<script src="../app-runtime.js"></script>
</body></html>
