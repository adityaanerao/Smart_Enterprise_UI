<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curved Bottom Navbar Test</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Inter', sans-serif;
    background: #0b1329;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .phone-screen {
    width: 100%;
    max-width: 440px;
    height: 640px;
    background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    border-radius: 36px;
  }

  .screen-content {
    padding: 30px 24px;
    color: #fff;
  }

  /* ======================================================== */
  /* CURVED ANIMATED BOTTOM NAVIGATION BAR                    */
  /* ======================================================== */
  .curved-navbar-wrapper {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    z-index: 100;
    filter: drop-shadow(0 -8px 24px rgba(0, 0, 0, 0.12));
    user-select: none;
  }

  .curved-navbar-body {
    position: relative;
    background: #ffffff;
    border-radius: 28px 28px 0 0;
    padding-top: 8px;
    padding-bottom: env(safe-area-inset-bottom, 12px);
  }

  /* Sliding Indicator Layer */
  .nav-sliding-indicator {
    position: absolute;
    top: 0;
    left: 0;
    width: 20%;
    height: 100%;
    pointer-events: none;
    transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform: translateX(calc(100% * var(--active-tab, 0)));
    z-index: 10;
  }

  /* Seamless White Dome SVG sitting above the navbar */
  .nav-dome-svg {
    position: absolute;
    top: -24px;
    left: 50%;
    transform: translateX(-50%);
    width: 96px;
    height: 25px;
    fill: #ffffff;
    pointer-events: none;
  }

  /* Elevated Floating Circular Button */
  .nav-floating-circle {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, #FF3D47 0%, #D81921 55%, #A60911 100%);
    box-shadow: 0 10px 24px rgba(216, 25, 33, 0.42), 0 2px 6px rgba(0, 0, 0, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
    animation: popBubble 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes popBubble {
    0% { transform: translateX(-50%) scale(0.7); }
    60% { transform: translateX(-50%) scale(1.12); }
    100% { transform: translateX(-50%) scale(1); }
  }

  .nav-floating-circle svg {
    width: 25px;
    height: 25px;
    stroke-width: 2.2;
    transition: transform 0.25s ease;
  }

  /* Tab Navigation Items List */
  .nav-tabs-row {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-around;
    height: 62px;
    z-index: 20;
  }

  .nav-tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    cursor: pointer;
    background: transparent;
    border: none;
    outline: none;
    padding: 4px 0;
    transition: all 0.25s ease;
  }

  .nav-tab-icon-wrap {
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .nav-tab-item .nav-tab-icon-wrap svg {
    width: 22px;
    height: 22px;
    color: #94a3b8;
    transition: color 0.25s ease, transform 0.25s ease;
  }

  .nav-tab-item:hover .nav-tab-icon-wrap svg {
    color: #475569;
    transform: translateY(-1px);
  }

  .nav-tab-item.active .nav-tab-icon-wrap {
    opacity: 0;
    visibility: hidden;
  }

  .nav-tab-label {
    font-size: 11px;
    font-weight: 600;
    color: #64748b;
    margin-top: 2px;
    letter-spacing: -0.01em;
    transition: color 0.25s ease, font-weight 0.25s ease, transform 0.25s ease;
  }

  .nav-tab-item.active .nav-tab-label {
    color: #D81921;
    font-weight: 800;
    transform: translateY(-2px);
  }

  /* Safe Area / iOS Home Indicator Bar */
  .nav-home-indicator {
    width: 128px;
    height: 4.5px;
    background: #0f172a;
    border-radius: 9999px;
    opacity: 0.2;
    margin: 4px auto 6px;
  }
</style>
</head>
<body>

<div class="phone-screen">
  <div class="screen-content">
    <h2 id="screenTitle" style="font-size:22px; font-weight:800; margin-bottom:8px;">Home Dashboard</h2>
    <p id="screenDesc" style="font-size:13px; color:#94a3b8;">Testing interactive curved bottom navbar animation.</p>
  </div>

  <!-- Curved Navbar -->
  <div class="curved-navbar-wrapper" id="curvedNavWrapper" style="--active-tab: 0;">
    <div class="curved-navbar-body">

      <!-- Sliding Dome & Elevated Circle -->
      <div class="nav-sliding-indicator" id="navIndicator">
        <!-- SVG Dome that merges into the navbar -->
        <svg class="nav-dome-svg" viewBox="0 0 100 26" preserveAspectRatio="none">
          <path d="M 0,26 C 14,26 22,20 28,12 C 36,1 42,0 50,0 C 58,0 64,1 72,12 C 78,20 86,26 100,26 L 100,28 L 0,28 Z" />
        </svg>
        
        <!-- Elevated Floating Circle Button -->
        <div class="nav-floating-circle" id="floatingCircle">
          <span id="floatingIconContainer">
            <!-- Dynamic Active Icon -->
            <svg fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path></svg>
          </span>
        </div>
      </div>

      <!-- 5 Standard Navigation Tabs (Matching Motors Screen) -->
      <div class="nav-tabs-row" id="navTabsRow">
        <!-- Tab 0: Home -->
        <button class="nav-tab-item active" data-index="0" data-route="home">
          <div class="nav-tab-icon-wrap">
            <svg fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path></svg>
          </div>
          <span class="nav-tab-label">Home</span>
        </button>

        <!-- Tab 1: Motors -->
        <button class="nav-tab-item" data-index="1" data-route="motors">
          <div class="nav-tab-icon-wrap">
            <svg fill="currentColor" viewBox="0 0 24 24"><path d="M19 13h-1V9a2 2 0 00-2-2h-1V5a1 1 0 00-1-1H9a1 1 0 00-1 1v2H7a2 2 0 00-2 2v4H4a1 1 0 00-1 1v4a1 1 0 001 1h1v1a1 1 0 001 1h12a1 1 0 001-1v-1h1a1 1 0 001-1v-4a1 1 0 00-1-1zm-9-6h4v2h-4V7zm6 11H8v-7h8v7z"></path></svg>
          </div>
          <span class="nav-tab-label">Motors</span>
        </button>

        <!-- Tab 2: Schedules -->
        <button class="nav-tab-item" data-index="2" data-route="schedule">
          <div class="nav-tab-icon-wrap">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          </div>
          <span class="nav-tab-label">Schedules</span>
        </button>

        <!-- Tab 3: Analytics -->
        <button class="nav-tab-item" data-index="3" data-route="analytics">
          <div class="nav-tab-icon-wrap">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z"></path></svg>
          </div>
          <span class="nav-tab-label">Analytics</span>
        </button>

        <!-- Tab 4: Profile -->
        <button class="nav-tab-item" data-index="4" data-route="profile">
          <div class="nav-tab-icon-wrap">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"></path></svg>
          </div>
          <span class="nav-tab-label">Profile</span>
        </button>
      </div>

      <!-- Home Indicator -->
      <div class="nav-home-indicator"></div>
    </div>
  </div>
</div>

<script>
  const navWrapper = document.getElementById('curvedNavWrapper');
  const tabs = document.querySelectorAll('.nav-tab-item');
  const floatingIcon = document.getElementById('floatingIconContainer');
  const floatingCircle = document.getElementById('floatingCircle');
  const screenTitle = document.getElementById('screenTitle');
  const screenDesc = document.getElementById('screenDesc');

  const titles = ['Home Dashboard', 'Motors Device Fleet', 'Operation Schedules', 'Telemetry Analytics', 'Operator Profile'];
  const descs = [
    'Quick overview of system health, running status, and motor controls.',
    'List of 4 agricultural motors, current load, and start/stop controls.',
    'Automated irrigation timing slots, repeat cycles, and dry-run protection.',
    'Real-time kW load, power factor, historical energy savings, and phase data.',
    'National operator credentials, emergency contacts, and notifications.'
  ];

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const idx = tab.getAttribute('data-index');
      setActiveTab(idx);
    });
  });

  function setActiveTab(index) {
    navWrapper.style.setProperty('--active-tab', index);
    tabs.forEach(t => t.classList.remove('active'));
    const activeTab = document.querySelector(`.nav-tab-item[data-index="${index}"]`);
    if (activeTab) {
      activeTab.classList.add('active');
      const iconSvg = activeTab.querySelector('.nav-tab-icon-wrap svg');
      if (iconSvg) {
        floatingIcon.innerHTML = iconSvg.outerHTML;
      }
    }

    // Re-trigger spring bounce animation on circle
    floatingCircle.style.animation = 'none';
    floatingCircle.offsetHeight; // trigger reflow
    floatingCircle.style.animation = 'popBubble 0.45s cubic-bezier(0.34, 1.56, 0.64, 1)';

    screenTitle.textContent = titles[index];
    screenDesc.textContent = descs[index];
  }
</script>
</body>
</html>
