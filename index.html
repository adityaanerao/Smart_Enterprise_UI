<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>National Smart Motor Control</title>
  <meta name="description" content="National Smart Motor Control & Monitoring Mobile Application">
  <!-- Google Fonts: Inter (Clear, Simple, Standard UI Font) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0b111e 70%, #050811 100%);
      color: #f8fafc;
    }

    /* Ambient Viewport Container */
    .app-viewport {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Subtle background ambient glow for sleek presentation */
    .ambient-glow-1 {
      position: absolute;
      top: -15%;
      left: 15%;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(217, 29, 36, 0.12) 0%, transparent 70%);
      filter: blur(70px);
      pointer-events: none;
      z-index: 1;
    }

    .ambient-glow-2 {
      position: absolute;
      bottom: -15%;
      right: 15%;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.10) 0%, transparent 70%);
      filter: blur(70px);
      pointer-events: none;
      z-index: 1;
    }

    /* Top Showcase Bar for Desktop view */
    .showcase-header {
      position: absolute;
      top: 14px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 20;
      pointer-events: auto;
    }

    .showcase-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .showcase-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(217, 29, 36, 0.15);
      border: 1px solid rgba(217, 29, 36, 0.4);
      padding: 4px 10px;
      border-radius: 9999px;
      color: #ff4d53;
      font-size: 11px;
      font-weight: 600;
    }

    .showcase-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff4d53;
      box-shadow: 0 0 8px #ff4d53;
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .action-pill {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      color: #e2e8f0;
      padding: 7px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .action-pill:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    /* Clean Mobile Screen Structure - Completely Removed Phone Borders, Time, and Bottom Line */
    .mobile-app-container {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      z-index: 10;
      border: none;
      outline: none;
    }

    iframe#appFrame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #ffffff;
      transition: opacity 0.15s ease;
    }

    iframe#appFrame.transitioning {
      opacity: 0.85;
    }

    /* Edge-to-edge on mobile screens */
    @media (max-width: 600px) {
      .app-viewport {
        background: #ffffff;
      }
      .showcase-header {
        display: none;
      }
      .ambient-glow-1, .ambient-glow-2 {
        display: none;
      }
      .mobile-app-container {
        max-width: 100vw;
        height: 100vh;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="app-viewport">
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <!-- Desktop brand bar -->
    <header class="showcase-header">
      <div class="showcase-brand">
        <img src="assets/national-logo.svg" alt="National Logo" style="height: 28px; width: auto; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.25);">
        <span>NATIONAL</span>
        <span style="color:#94a3b8;font-weight:400;margin-left:-4px;">Smart Motor Control</span>
        <div class="showcase-badge">
          <span class="dot"></span>
          Live App
        </div>
      </div>

      <div class="showcase-actions">
        <button class="action-pill" id="restartAppBtn" title="Restart App to Splash Screen">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
          Restart Demo
        </button>
      </div>
    </header>

    <!-- Mobile Screen Viewport (Strictly Mobile Structure, NO phone border, NO status bar time, NO bottom line) -->
    <main class="mobile-app-container" id="appContainer">
      <iframe id="appFrame" title="National Smart Motor Control Mobile Screen" src="national_splash_screen_custom_farm_background/code.html"></iframe>
    </main>
  </div>

  <script>
    // Screen Registry
    const screenRoutes = {
      splash: 'national_splash_screen_custom_farm_background',
      login: 'national_login_screen',
      home: 'national_farm_operator_home_dashboard',
      motors: 'all_motors_device_list',
      details: 'motor_details_screen',
      control: 'motor_control_screen',
      schedule: 'create_schedule_motor_timing_slots',
      protection: 'motor_protection_main_hub',
      overload: 'overload_protection_settings',
      voltage: 'voltage_protection_settings',
      dryrun: 'dry_run_protection_settings',
      phase: 'phase_protection_settings',
      review: 'review_apply_settings',
      confirm: 'apply_settings_confirmation_modal',
      advanced: 'advanced_electrical_settings',
      profile: 'national_operator_profile_screen',
      analytics: 'national_motor_analytics_screen',

      // Folder names fallback
      national_splash_screen_custom_farm_background: 'national_splash_screen_custom_farm_background',
      national_login_screen: 'national_login_screen',
      national_farm_operator_home_dashboard: 'national_farm_operator_home_dashboard',
      all_motors_device_list: 'all_motors_device_list',
      motor_details_screen: 'motor_details_screen',
      motor_control_screen: 'motor_control_screen',
      create_schedule_motor_timing_slots: 'create_schedule_motor_timing_slots',
      motor_protection_main_hub: 'motor_protection_main_hub',
      overload_protection_settings: 'overload_protection_settings',
      voltage_protection_settings: 'voltage_protection_settings',
      dry_run_protection_settings: 'dry_run_protection_settings',
      phase_protection_settings: 'phase_protection_settings',
      review_apply_settings: 'review_apply_settings',
      apply_settings_confirmation_modal: 'apply_settings_confirmation_modal',
      advanced_electrical_settings: 'advanced_electrical_settings',
      national_operator_profile_screen: 'national_operator_profile_screen',
      national_motor_analytics_screen: 'national_motor_analytics_screen'
    };

    const frame = document.getElementById('appFrame');
    let currentScreen = 'splash';

    function navigateTo(key) {
      const folder = screenRoutes[key] || key;
      if (!folder) return;
      currentScreen = key;

      frame.classList.add('transitioning');
      setTimeout(() => {
        frame.src = folder + '/code.html';
        history.replaceState(null, '', '#' + (screenRoutes[key] ? key : folder));
        setTimeout(() => frame.classList.remove('transitioning'), 180);
      }, 60);
    }

    // Message receiver from internal screen actions
    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'motor-app-navigate') {
        navigateTo(e.data.screen);
      }
    });

    // Hash change navigation
    window.addEventListener('hashchange', () => {
      const hash = location.hash.slice(1);
      if (hash && screenRoutes[hash]) {
        navigateTo(hash);
      }
    });

    // Restart Button
    document.getElementById('restartAppBtn').addEventListener('click', () => {
      localStorage.removeItem('nationalMotorDemoState');
      navigateTo('splash');
    });

    // Initial load
    const initialHash = location.hash.slice(1);
    if (initialHash && screenRoutes[initialHash]) {
      navigateTo(initialHash);
    } else {
      navigateTo('splash');
    }
  </script>
</body>
</html>
