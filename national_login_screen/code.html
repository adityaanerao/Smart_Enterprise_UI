<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Smart Enterprises — Login</title>
<!-- Google Fonts: Inter (Clear, Simple, Standard UI Font) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- Tailwind CSS CDN with forms and container queries plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#DE0000',
              'red-hover': '#B80000',
              'red-light': '#FEE2E2',
              navy: '#131E3A',
              subtext: '#64748B'
            }
          },
          fontFamily: {
            sans: ['"Inter"', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    };
  </script>
<!-- BEGIN: Custom Layout & Decorative Styles -->
<style data-purpose="hero-and-waves">
    /* Organic curve overlays between hero image and form body */
    .hero-mask-wrap {
      position: relative;
      width: 100%;
      height: 400px;
      overflow: hidden;
    }

    .hero-bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center bottom;
    }

    /* Subtle soft white gradient overlay on sky area to ensure logo & typography clarity */
    .hero-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.15) 45%, rgba(0, 0, 0, 0.05) 100%);
    }

    /* Smooth organic transition curve at bottom of hero */
    .hero-curved-svg {
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: auto;
      pointer-events: none;
      z-index: 10;
    }

    /* Ambient bottom wave overlay */
    .bottom-curved-accent {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.75;
    }
  </style>
<style data-purpose="input-focus-and-interactions">
    /* Input interaction styles */
    .custom-input:focus-within {
      border-color: #DE0000;
      box-shadow: 0 0 0 3px rgba(217, 26, 35, 0.12);
    }
    
    /* Interactive button scale effect on active */
    .btn-press:active {
      transform: scale(0.985);
    }
  </style>
<!-- END: Custom Layout & Decorative Styles -->
</head>
<body class="bg-gray-100 font-sans text-slate-800 antialiased min-h-screen flex justify-center items-start selection:bg-brand-red selection:text-white">
<!-- Mobile Viewport Container -->
<main class="w-full max-w-[430px] bg-white min-h-screen relative flex flex-col shadow-2xl overflow-hidden pb-10" data-purpose="mobile-screen-wrapper">
<!-- BEGIN: HeroSection -->
<header class="relative w-full" data-purpose="hero-header">
<div class="hero-mask-wrap" style="height: 410px;">
<!-- Farm background featuring golden hour sky, lush field and irrigation pump -->
<img alt="Irrigation pump watering crop field during sunrise" class="hero-bg-img" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBQ12BgN4q4yv83VDT54bzHbS68KLL1rG1vDBCBJSez3-JsbWWX_niO4NuPRANTI6-WshtwiA6wES2CAW5KTbA0HxX7IckueIYgMWnHdwwzlUi2U2rt5smSFEbuJMNzz4iSfjlmTm6yzYOHznDBUsX_xyDNtX1lPv0DAjTR5bw52cuBOENPRkl9b4HPkuGIvpOSYonqv_ANhRTqSk88u2e7UazDWkDtv3GWxn2IIYHEETTGx-lYXseLmBsa-_yTBBqZiw" style="object-position: center 18%;">
<!-- Soft contrast overlay for text and brand readability -->
<div class="hero-scrim" style="background: linear-gradient(rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0.45) 45%, rgba(255, 255, 255, 0.05) 85%, rgba(0, 0, 0, 0.05) 100%);"></div>
<!-- Brand Emblem and Header Copy -->
<div class="relative z-10 pt-8 px-6 flex flex-col items-center text-center">
  <!-- Smart Enterprises Brand Logo -->
  <div class="transform transition duration-300 hover:scale-105" data-purpose="brand-logo">
    <img src="../assets/smart-logo.png" alt="Smart Enterprises Logo" class="w-[170px] h-auto drop-shadow-xl">
  </div>

<!-- App Title and Slogan -->
<div class="mt-3.5 px-2" data-purpose="app-branding-titles">
  <h1 class="font-black tracking-tight text-slate-800 leading-tight" style="font-size: 21px; color: #1E293B;">
    Smart Enterprises<br>
    <span class="font-semibold text-slate-700" style="font-size: 16px; color: #334155;">Smart Motor Control &amp; Monitoring</span>
  </h1>
  <p class="mt-1.5 font-bold tracking-wider uppercase text-[12px]" style="color: #DE0000;">
    Where is smart, there is a security
  </p>
  <!-- Small Red Accent Indicator Line -->
  <div class="rounded-full mx-auto mt-2" style="width: 38px; height: 3px; background-color: #DE0000;"></div>
</div></div>
<!-- Smooth organic wave cut transition into form container -->
<svg class="hero-curved-svg" fill="none" preserveAspectRatio="none" viewBox="0 0 430 70" xmlns="http://www.w3.org/2000/svg"><path d="M0,38 C120,62 250,12 430,46 L430,70 L0,70 Z" fill="#F87171" fill-opacity="0.45"></path>
<path d="M0,45 C130,66 260,20 430,50 L430,70 L0,70 Z" fill="#FFFFFF"></path></svg>
</div>
</header>
<!-- END: HeroSection -->
<!-- BEGIN: LoginFormSection -->
<section class="relative z-20 px-7 pt-1 pb-6 flex-1 flex flex-col justify-start bg-white" data-purpose="login-form-container">
<!-- Welcome Heading Block -->
<div class="mb-6">
<h2 class="text-[26px] font-extrabold text-slate-900 tracking-tight">Welcome Back</h2>
<p class="text-slate-500 text-[14px] mt-1 font-normal">Login to access your farm and motor controls</p>
</div>
<!-- Login Credentials Form -->
<form class="space-y-4" data-purpose="credentials-form" id="loginForm" onsubmit="event.preventDefault();">
<!-- Mobile Number / Email Input Field -->
<div class="space-y-1">
<label class="sr-only" for="identifier">Mobile Number or Email</label>
<div class="custom-input relative flex items-center bg-white border border-slate-300 rounded-xl px-4 py-3.5 transition-all duration-200">
<!-- User Outline Icon -->
<svg class="w-5 h-5 text-slate-400 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
<input class="w-full p-0 text-slate-800 text-[15px] placeholder-slate-400 bg-transparent border-0 focus:ring-0 focus:outline-none" id="identifier" name="identifier" placeholder="Mobile Number / Email" required="" type="text">
</div>
</div>
<!-- Password Input Field -->
<div class="space-y-1">
<label class="sr-only" for="password">Password</label>
<div class="custom-input relative flex items-center bg-white border border-slate-300 rounded-xl px-4 py-3.5 transition-all duration-200">
<!-- Lock Outline Icon -->
<svg class="w-5 h-5 text-slate-400 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
<input class="w-full p-0 text-slate-800 text-[15px] placeholder-slate-400 bg-transparent border-0 focus:ring-0 focus:outline-none" id="password" name="password" placeholder="Password" required="" type="password">
<!-- Password Visibility Toggle Button -->
<button aria-label="Toggle password visibility" class="ml-2 text-slate-400 hover:text-slate-600 focus:outline-none p-1 rounded transition-colors" id="togglePasswordBtn" type="button">
<svg class="w-5 h-5" fill="none" id="eyeIcon" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end pt-0.5">
<a class="text-brand-red hover:underline text-[13px] font-semibold transition-colors" href="#forgot-password">
            Forgot Password?
          </a>
</div>
<!-- Primary Action: Login Button -->
<div class="pt-2">
<button class="btn-press w-full bg-brand-red hover:bg-brand-red-hover text-white font-bold py-3.5 px-6 rounded-xl shadow-md shadow-red-500/20 flex items-center justify-center space-x-2 transition-all duration-200" data-purpose="submit-login-button" data-route="home" type="submit">
<span class="text-[16px] tracking-wide">Login</span>
<svg class="w-5 h-5 ml-1 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path>
</svg>
</button>
</div>
</form>
<!-- OR Separator Line -->
<div class="relative flex items-center justify-center my-6" data-purpose="alternative-login-divider">
<div class="border-t border-slate-200 w-full"></div>
<span class="bg-white px-3 text-[12px] font-semibold text-slate-400 tracking-wider">OR</span>
<div class="border-t border-slate-200 w-full"></div>
</div>
<!-- Secondary Action: Login with OTP Button -->
<div>
<button class="btn-press w-full bg-white hover:bg-red-50 border-[1.5px] border-brand-red text-brand-red font-bold py-3.5 px-6 rounded-xl flex items-center justify-center space-x-2.5 transition-all duration-200 shadow-sm" data-purpose="otp-login-button" type="button">
<!-- Smartphone Outline Icon -->
<svg class="w-5 h-5 text-brand-red" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<rect height="20" rx="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" width="10" x="7" y="2"></rect>
<path d="M11 18H13" stroke-linecap="round" stroke-width="2"></path>
</svg>
<span class="text-[15px]">Login with OTP</span>
</button>
</div>
</section>
<!-- END: LoginFormSection -->
<!-- BEGIN: BottomDecorativeWave -->
<!-- Subtle organic warm gradient flourish at the bottom footer -->
<div aria-hidden="true" class="bottom-curved-accent">
<svg class="w-full h-auto" fill="none" viewBox="0 0 430 80" xmlns="http://www.w3.org/2000/svg">
<path d="M0,80 L430,80 L430,20 C320,65 150,10 0,55 Z" fill="#FEE2E2" fill-opacity="0.6"></path>
<path d="M0,80 L430,80 L430,40 C340,75 190,30 0,65 Z" fill="#FED7AA" fill-opacity="0.25"></path>
</svg>
</div>
<!-- END: BottomDecorativeWave -->
</main>
<!-- BEGIN: InteractiveScripts -->
<script data-purpose="password-visibility-toggle">
    // Toggle password masking visibility
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');

    if (togglePasswordBtn && passwordInput) {
      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        
        // Minor visual feedback on eye icon
        togglePasswordBtn.classList.toggle('text-brand-red', isPassword);
        togglePasswordBtn.classList.toggle('text-slate-400', !isPassword);
      });
    }
  </script>
<!-- END: InteractiveScripts -->


<script src="../app-runtime.js"></script>
</body></html>
